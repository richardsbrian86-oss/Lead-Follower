kind = "web"
previewPath = "/"
title = "Gym Lead Tracker"
version = "1.0.0"
id = "artifacts/gym-leads"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23656

[services.development]
run = "pnpm --filter @workspace/gym-leads run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gym-leads", "run", "build" ]
publicDir = "artifacts/gym-leads/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23656"
BASE_PATH = "/"
