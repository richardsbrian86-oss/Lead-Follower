kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
# Pinned canonical production domain — used by getAppUrl() (src/routes/invites.ts)
# to build the invite email link, so it always matches the domain hosted in
# gym-leads' public/.well-known/ files and configured in the mobile app's
# app.json (associatedDomains / intentFilters) for universal/app links.
# If a custom domain is added later, update this AND app.json AND the
# .well-known files together, or the invite link will stop opening the app.
APP_URL = "https://lead-follower-richardsbrian86.replit.app"

[services.production.health.startup]
path = "/api/healthz"
