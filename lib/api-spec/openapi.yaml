openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead management
  - name: dashboard
    description: Dashboard summaries
  - name: messaging
    description: Lead outbound messaging
  - name: sequences
    description: Follow-up sequence management
  - name: analytics
    description: Analytics and trend data
  - name: anthropic
    description: Anthropic AI chat operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/LeadStatus"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a new lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead with events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadWithEvents"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadInput"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leads/{id}/events:
    post:
      operationId: createLeadEvent
      tags: [leads]
      summary: Add an event/note to a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadEventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadEvent"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/action-queue:
    get:
      operationId: getDashboardActionQueue
      tags: [dashboard]
      summary: Get prioritized action queue for today
      description: Returns up to 8 leads ranked by urgency score for staff to action today
      responses:
        "200":
          description: Prioritized action queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionQueue"

  /leads/{id}/score:
    get:
      operationId: getLeadScore
      tags: [leads]
      summary: Get predictive score for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead score and factor breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadScore"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/messages:
    get:
      operationId: getLeadMessages
      tags: [messaging]
      summary: Get outbound message history for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of outbound messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutboundMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/messages/draft:
    post:
      operationId: draftLeadMessage
      tags: [messaging]
      summary: AI-draft a message for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftMessageInput"
      responses:
        "200":
          description: Drafted message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDraft"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/messages/send:
    post:
      operationId: sendLeadMessage
      tags: [messaging]
      summary: Send a message to a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Sent message record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/sequence:
    get:
      operationId: getLeadSequence
      tags: [sequences]
      summary: Get the follow-up sequence state for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sequence state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSequence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/sequence/pause:
    post:
      operationId: pauseLeadSequence
      tags: [sequences]
      summary: Pause the follow-up sequence for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSequence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/sequence/resume:
    post:
      operationId: resumeLeadSequence
      tags: [sequences]
      summary: Resume the follow-up sequence for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSequence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/sequence/cancel:
    post:
      operationId: cancelLeadSequence
      tags: [sequences]
      summary: Cancel the follow-up sequence for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSequence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sequences/templates:
    get:
      operationId: listSequenceTemplates
      tags: [sequences]
      summary: List all sequence step templates
      responses:
        "200":
          description: All templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SequenceTemplate"

  /analytics/insights:
    post:
      operationId: streamAnalyticsInsights
      tags: [analytics]
      summary: Stream AI-generated coaching insights based on current analytics data (SSE)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsInsightsInput"
      responses:
        "200":
          description: SSE stream of insight text chunks
          content:
            text/event-stream: {}

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"
  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /analytics/pulse:
    get:
      operationId: getAnalyticsPulse
      tags: [analytics]
      summary: Get top-line pulse metrics
      responses:
        "200":
          description: Pulse metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsPulse"

  /analytics/conversion-trend:
    get:
      operationId: getAnalyticsConversionTrend
      tags: [analytics]
      summary: Get weekly conversion rate for the last 12 weeks
      responses:
        "200":
          description: Weekly conversion trend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionTrend"

  /analytics/pipeline-funnel:
    get:
      operationId: getAnalyticsPipelineFunnel
      tags: [analytics]
      summary: Get lead count per pipeline stage
      responses:
        "200":
          description: Pipeline funnel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineFunnel"

  /analytics/sequence-funnel:
    get:
      operationId: getAnalyticsSequenceFunnel
      tags: [analytics]
      summary: Get sequence step performance
      responses:
        "200":
          description: Sequence funnel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SequenceFunnel"

  /analytics/score-distribution:
    get:
      operationId: getAnalyticsScoreDistribution
      tags: [analytics]
      summary: Get lead count per score bracket
      responses:
        "200":
          description: Score distribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreDistribution"

  /sequences/templates/{step}:
    put:
      operationId: updateSequenceTemplate
      tags: [sequences]
      summary: Update a sequence step template
      parameters:
        - name: step
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSequenceTemplateInput"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SequenceTemplate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the returnTo path on success or /api/login on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LeadStatus:
      type: string
      enum: [new, contacted, interested, won, lost]

    ScoreFactors:
      type: object
      properties:
        visitRecency:
          type: number
        status:
          type: number
        activity:
          type: number
        outreachEngagement:
          type: number
        sequenceProgress:
          type: number
      required:
        - visitRecency
        - status
        - activity
        - outreachEngagement
        - sequenceProgress

    LeadScore:
      type: object
      properties:
        score:
          type: integer
        factors:
          $ref: "#/components/schemas/ScoreFactors"
      required:
        - score
        - factors

    Lead:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        visitDate:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        notes:
          type: string
          nullable: true
        score:
          type: integer
        scoreFactors:
          $ref: "#/components/schemas/ScoreFactors"
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - email
        - phone
        - visitDate
        - status
        - score
        - createdAt
        - updatedAt

    LeadEvent:
      type: object
      properties:
        id:
          type: integer
        leadId:
          type: integer
        type:
          type: string
        note:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - leadId
        - type
        - createdAt

    LeadWithEvents:
      allOf:
        - $ref: "#/components/schemas/Lead"
        - type: object
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/LeadEvent"
          required:
            - events

    CreateLeadInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        visitDate:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        notes:
          type: string
          nullable: true
      required:
        - name
        - email
        - phone
        - visitDate

    UpdateLeadInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        visitDate:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        notes:
          type: string
          nullable: true

    CreateLeadEventInput:
      type: object
      properties:
        type:
          type: string
        note:
          type: string
          nullable: true
      required:
        - type

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DashboardSummary:
      type: object
      properties:
        totalLeads:
          type: integer
        newLeads:
          type: integer
        contactedLeads:
          type: integer
        interestedLeads:
          type: integer
        wonLeads:
          type: integer
        lostLeads:
          type: integer
        followUpsDueToday:
          type: integer
        conversionRate:
          type: number
        recentLeads:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
        hotLeads:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
      required:
        - totalLeads
        - newLeads
        - contactedLeads
        - interestedLeads
        - wonLeads
        - lostLeads
        - followUpsDueToday
        - conversionRate
        - recentLeads
        - hotLeads

    OutboundMessage:
      type: object
      properties:
        id:
          type: integer
        leadId:
          type: integer
        channel:
          type: string
          enum: [email, sms]
        subject:
          type: string
          nullable: true
        body:
          type: string
        status:
          type: string
          enum: [sent, failed, pending]
        errorMessage:
          type: string
          nullable: true
        sentAt:
          type: string
          nullable: true
        sequenceStep:
          type: integer
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - leadId
        - channel
        - body
        - status
        - createdAt

    DraftMessageInput:
      type: object
      properties:
        channel:
          type: string
          enum: [email, sms]
        stepHint:
          type: integer
          nullable: true
      required:
        - channel

    MessageDraft:
      type: object
      properties:
        subject:
          type: string
          nullable: true
        body:
          type: string
        channel:
          type: string
          enum: [email, sms]
      required:
        - body
        - channel

    SendMessageInput:
      type: object
      properties:
        channel:
          type: string
          enum: [email, sms]
        subject:
          type: string
          nullable: true
        body:
          type: string
        sequenceStep:
          type: integer
          nullable: true
      required:
        - channel
        - body

    LeadSequence:
      type: object
      properties:
        id:
          type: integer
        leadId:
          type: integer
        currentStep:
          type: integer
        paused:
          type: boolean
        cancelled:
          type: boolean
        nextSendAt:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - leadId
        - currentStep
        - paused
        - cancelled
        - createdAt
        - updatedAt

    SequenceTemplate:
      type: object
      properties:
        id:
          type: integer
        step:
          type: integer
        delayDays:
          type: integer
        toneInstruction:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - step
        - delayDays
        - toneInstruction
        - createdAt
        - updatedAt

    UpdateSequenceTemplateInput:
      type: object
      properties:
        delayDays:
          type: integer
        toneInstruction:
          type: string

    ActionItem:
      type: object
      properties:
        leadId:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        score:
          type: integer
        urgencyScore:
          type: integer
        primaryReason:
          type: string
        secondaryReasons:
          type: array
          items:
