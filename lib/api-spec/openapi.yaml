openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead management
  - name: dashboard
    description: Dashboard summaries
  - name: messaging
    description: Lead outbound messaging
  - name: sequences
    description: Follow-up sequence management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/LeadStatus"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a new lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead with events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadWithEvents"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadInput"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leads/{id}/events:
    post:
      operationId: createLeadEvent
      tags: [leads]
      summary: Add an event/note to a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadEventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadEvent"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /leads/{id}/score:
    get:
      operationId: getLeadScore
      tags: [leads]
      summary: Get predictive score for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead score and factor breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadScore"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/messages:
    get:
      operationId: getLeadMessages
      tags: [messaging]
      summary: Get outbound message history for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of outbound messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutboundMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/messages/draft:
    post:
      operationId: draftLeadMessage
      tags: [messaging]
      summary: AI-draft a message for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftMessageInput"
      responses:
        "200":
          description: Drafted message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDraft"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/messages/send:
    post:
      operationId: sendLeadMessage
      tags: [messaging]
      summary: Send a message to a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Sent message record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboundMessage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/sequence:
    get:
      operationId: getLeadSequence
      tags: [sequences]
      summary: Get the follow-up sequence state for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sequence state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSequence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/sequence/pause:
    post:
      operationId: pauseLeadSequence
      tags: [sequences]
      summary: Pause the follow-up sequence for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSequence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/sequence/resume:
    post:
      operationId: resumeLeadSequence
      tags: [sequences]
      summary: Resume the follow-up sequence for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSequence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leads/{id}/sequence/cancel:
    post:
      operationId: cancelLeadSequence
      tags: [sequences]
      summary: Cancel the follow-up sequence for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadSequence"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sequences/templates:
    get:
      operationId: listSequenceTemplates
      tags: [sequences]
      summary: List all sequence step templates
      responses:
        "200":
          description: All templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SequenceTemplate"

  /sequences/templates/{step}:
    put:
      operationId: updateSequenceTemplate
      tags: [sequences]
      summary: Update a sequence step template
      parameters:
        - name: step
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSequenceTemplateInput"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SequenceTemplate"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LeadStatus:
      type: string
      enum: [new, contacted, interested, won, lost]

    ScoreFactors:
      type: object
      properties:
        visitRecency:
          type: number
        status:
          type: number
        activity:
          type: number
        outreachEngagement:
          type: number
        sequenceProgress:
          type: number
      required:
        - visitRecency
        - status
        - activity
        - outreachEngagement
        - sequenceProgress

    LeadScore:
      type: object
      properties:
        score:
          type: integer
        factors:
          $ref: "#/components/schemas/ScoreFactors"
      required:
        - score
        - factors

    Lead:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        visitDate:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        notes:
          type: string
          nullable: true
        score:
          type: integer
        scoreFactors:
          $ref: "#/components/schemas/ScoreFactors"
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - email
        - phone
        - visitDate
        - status
        - score
        - createdAt
        - updatedAt

    LeadEvent:
      type: object
      properties:
        id:
          type: integer
        leadId:
          type: integer
        type:
          type: string
        note:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - leadId
        - type
        - createdAt

    LeadWithEvents:
      allOf:
        - $ref: "#/components/schemas/Lead"
        - type: object
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/LeadEvent"
          required:
            - events

    CreateLeadInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        visitDate:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        notes:
          type: string
          nullable: true
      required:
        - name
        - email
        - phone
        - visitDate

    UpdateLeadInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        visitDate:
          type: string
        status:
          $ref: "#/components/schemas/LeadStatus"
        notes:
          type: string
          nullable: true

    CreateLeadEventInput:
      type: object
      properties:
        type:
          type: string
        note:
          type: string
          nullable: true
      required:
        - type

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DashboardSummary:
      type: object
      properties:
        totalLeads:
          type: integer
        newLeads:
          type: integer
        contactedLeads:
          type: integer
        interestedLeads:
          type: integer
        wonLeads:
          type: integer
        lostLeads:
          type: integer
        followUpsDueToday:
          type: integer
        conversionRate:
          type: number
        recentLeads:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
        hotLeads:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
      required:
        - totalLeads
        - newLeads
        - contactedLeads
        - interestedLeads
        - wonLeads
        - lostLeads
        - followUpsDueToday
        - conversionRate
        - recentLeads
        - hotLeads

    OutboundMessage:
      type: object
      properties:
        id:
          type: integer
        leadId:
          type: integer
        channel:
          type: string
          enum: [email, sms]
        subject:
          type: string
          nullable: true
        body:
          type: string
        status:
          type: string
          enum: [sent, failed, pending]
        errorMessage:
          type: string
          nullable: true
        sentAt:
          type: string
          nullable: true
        sequenceStep:
          type: integer
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - leadId
        - channel
        - body
        - status
        - createdAt

    DraftMessageInput:
      type: object
      properties:
        channel:
          type: string
          enum: [email, sms]
        stepHint:
          type: integer
          nullable: true
      required:
        - channel

    MessageDraft:
      type: object
      properties:
        subject:
          type: string
          nullable: true
        body:
          type: string
        channel:
          type: string
          enum: [email, sms]
      required:
        - body
        - channel

    SendMessageInput:
      type: object
      properties:
        channel:
          type: string
          enum: [email, sms]
        subject:
          type: string
          nullable: true
        body:
          type: string
        sequenceStep:
          type: integer
          nullable: true
      required:
        - channel
        - body

    LeadSequence:
      type: object
      properties:
        id:
          type: integer
        leadId:
          type: integer
        currentStep:
          type: integer
        paused:
          type: boolean
        cancelled:
          type: boolean
        nextSendAt:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - leadId
        - currentStep
        - paused
        - cancelled
        - createdAt
        - updatedAt

    SequenceTemplate:
      type: object
      properties:
        id:
          type: integer
        step:
          type: integer
        delayDays:
          type: integer
        toneInstruction:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - step
        - delayDays
        - toneInstruction
        - createdAt
        - updatedAt

    UpdateSequenceTemplateInput:
      type: object
      properties:
        delayDays:
          type: integer
        toneInstruction:
          type: string
